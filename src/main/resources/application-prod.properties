# ==========================================
# PERFIL PRODUCCIÓN (AWS)
# Sin secretos: todo llega por variables de entorno (archivo .env del servidor).
# Se activa con SPRING_PROFILES_ACTIVE=prod (ya viene en el Dockerfile).
# ==========================================

# --- Base de datos (Amazon RDS MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?sslMode=REQUIRED&serverTimezone=America/Lima
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

# --- Logs más livianos en producción ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springdoc=INFO

# --- Detrás de Nginx + CloudFront ---
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*}

# --- Cloudinary ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# --- JWT y admin inicial ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}
jwt.admin.codigo=ADMIN
jwt.admin.password=${JWT_ADMIN_PASSWORD}
jwt.admin.nombre=Administrador
jwt.admin.apellido-pat=Sistema
jwt.admin.apellido-mat=Escolar
jwt.admin.gmail=${JWT_ADMIN_GMAIL:}
jwt.admin.rol=ADMIN

# --- Integraciones (opcionales) ---
api.dni.token=${API_TOKEN:}
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# --- Correo (recuperación de contraseña) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:noreply@escolar.edu.pe}
