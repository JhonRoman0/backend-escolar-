# ==========================================
# PERFIL ACTIVO
# ==========================================
spring.profiles.active=local


# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
# Imprimir cada consulta frena mucho el backend; para depurar, activarlo a mano.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# Las relaciones de varias filas se cargan juntas (IN de hasta 100) en vez de
# una consulta por fila (N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Las entidades con muchas relaciones EAGER generan consultas de ~20 tablas. Con la
# búsqueda por defecto, MySQL tarda de 1 s a minutos solo en planificarlas; con
# profundidad 4 tarda ~16 ms y el plan es el mismo en la práctica (las únicas
# lecturas completas son de tablas de pocas filas). Solo afecta a estas conexiones.
spring.datasource.hikari.connection-init-sql=SET SESSION optimizer_search_depth = 4

# Respuestas JSON comprimidas (los listados grandes pesan 300-400 KB sin comprimir).
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048

# Estrategias de Naming
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl


# ==========================================
# ARCHIVOS / MULTIPART
# ==========================================
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


# ==========================================
# INTEGRACIONES
# ==========================================
api.dni.url=https://apiperu.dev/api/dni


# ==========================================
# NOTIFICACIONES
# ==========================================
app.notificacion.proveedor=correo

# Doble factor: código al correo tras la contraseña (todos los usuarios).
app.dos-factor.activo=true


# ==========================================
# SESIONES / COOKIES
# ==========================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false


# ==========================================
# SWAGGER
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.org.springdoc=DEBUG
server.forward-headers-strategy=framework

app.swagger.authorize=true


# ==========================================
# SEED DEL ADMIN
# ==========================================
app.seed-admin.enabled=true


# ==========================================
# MAIL
# ==========================================
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000