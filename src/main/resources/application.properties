# BASE DE DATOS (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_escolar?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Estrategias de Naming
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# CLOUDINARY
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}
jwt.admin.codigo=${JWT_ADMIN_CODIGO:ADMIN}
jwt.admin.password=${JWT_ADMIN_PASSWORD}
jwt.admin.nombre=${JWT_ADMIN_NOMBRE:Administrador}
jwt.admin.apellido-pat=${JWT_ADMIN_APELLIDO_PAT:Sistema}
jwt.admin.apellido-mat=${JWT_ADMIN_APELLIDO_MAT:Escolar}
jwt.admin.gmail=${JWT_ADMIN_GMAIL:admin@escolar.edu.pe}
jwt.admin.rol=${JWT_ADMIN_ROL:ADMIN}

# ARCHIVOS / MULTIPART
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# INTEGRACIONES EXTERNAS

# CONSULTA DNI (apiperu.dev)
api.dni.token=${API_TOKEN}

# TWILIO (NOTIFICACIONES SMS/WHATSAPP)
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}

# NOTIFICACIONES DE ASISTENCIA
# Proveedor: simulador (por defecto, gratis) o twilio. Al cambiar a twilio se
# activa el envío real de SMS; las credenciales se toman de las variables TWILIO_*.
app.notificacion.proveedor=simulador

# CONFIGURACIÓN DE SESIONES / COOKIES
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false


# DOCUMENTACIÓN SWAGGER UI
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.org.springdoc=DEBUG
server.forward-headers-strategy=framework

# SWAGGER: botón "Authorize" (Bearer JWT) en Swagger UI.
# true = habilita el botón (desarrollo/pruebas). false = lo oculta (producción).
app.swagger.authorize=true

# SEED DEL ADMIN (DataSeeder.seedAdmin): crea el usuario admin JWT al arrancar.
# true = lo crea/activa (desarrollo). false = no lo toca (producción; el admin se gestiona aparte).
app.seed-admin.enabled=true